# Oracle gate registry for TeneT.jl.
#
# The runner reads this file with:
#   julia --project=. scripts/run_oracle_gates.jl --list
#
# Keep commands as argv arrays, not shell strings. This avoids quoting bugs on
# Windows, macOS, and Linux.

[gate.oracle_runner]
description = "Sanity check for the oracle gate registry and runner."
cmd = ["julia", "--project=.", "test/test_oracle_gates.jl"]
groups = ["quick", "oracle", "local"]
requires_mpi = false
requires_gpu = false
requires_cluster = false

[gate.full_serial]
description = "Full local serial regression suite run by the standard package test entry point."
cmd = ["julia", "--project=.", "-e", "using Pkg; Pkg.test()"]
groups = ["serial", "local", "ci"]
requires_mpi = false
requires_gpu = false
requires_cluster = false

[gate.chain_maps]
description = "Map-chain forward and gradient parity against the legacy TensorOperations path."
cmd = ["julia", "--project=.", "test/test_chain_maps.jl"]
groups = ["chain", "ad", "local"]
requires_mpi = false
requires_gpu = false
requires_cluster = false

